events {}

http {

    client_max_body_size 20M;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;


    server {

        listen 80;


        #################################################
        # Common CORS
        #################################################

        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Vary Origin always;


        #################################################
         # OPTIONS HANDLES
        #################################################

        if ($request_method = OPTIONS) {
            return 204;
        }



        #################################################
        # AUTH CHECK
        #################################################

        location = /auth {

            internal;


            proxy_pass https://user-service-ngrs.onrender.com/users/verify/;


            proxy_ssl_server_name on;
            proxy_ssl_name user-service-ngrs.onrender.com;
            proxy_ssl_verify off;


            proxy_pass_request_body off;

            proxy_set_header Content-Length "";

            proxy_set_header Host user-service-ngrs.onrender.com;


             # Websocket query token forward
            proxy_set_header X-Original-URI $request_uri;


             # Normal API token support
             proxy_set_header Authorization $http_authorization;

            
        }



        #################################################
        # USER SERVICE
        #################################################

        location /api/users/ {

            proxy_pass https://user-service-ngrs.onrender.com/users/;

            proxy_set_header Host user-service-ngrs.onrender.com;

            proxy_set_header Authorization $http_authorization;
        }



        #################################################
        # PRODUCT SERVICE
        #################################################

        location /api/products/ {

            auth_request /auth;


            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_email $upstream_http_x_user_email;
            auth_request_set $user_role $upstream_http_x_user_role;


            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Email $user_email;
            proxy_set_header X-User-Role $user_role;


            proxy_set_header Authorization $http_authorization;


            proxy_pass https://product-service-m498.onrender.com/products/;


            proxy_set_header Host product-service-m498.onrender.com;
        }

        #################################################
        # MEDIA FILES
        #################################################

        location /media/ {

            proxy_pass https://product-service-m498.onrender.com/media/;

            proxy_set_header Host $host;
        }



        #################################################
        # ORDER SERVICE
        #################################################

        location /api/orders/ {

            auth_request /auth;


            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_email $upstream_http_x_user_email;
            auth_request_set $user_role $upstream_http_x_user_role;


            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Email $user_email;
            proxy_set_header X-User-Role $user_role;


            proxy_set_header Authorization $http_authorization;


            proxy_pass https://order-service-ncyv.onrender.com/orders/;


            proxy_set_header Host order-service-ncyv.onrender.com;
        }



        #################################################
        # CHAT API
        #################################################

        location /api/chat/ {

            auth_request /auth;


            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_email $upstream_http_x_user_email;
            auth_request_set $user_role $upstream_http_x_user_role;


            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Email $user_email;
            proxy_set_header X-User-Role $user_role;


            proxy_set_header Authorization $http_authorization;


            proxy_pass https://ecommerce-platform-252e.onrender.com/chat/;


            proxy_set_header Host ecommerce-platform-252e.onrender.com;
        }



        #################################################
        # CHAT WEBSOCKET
        #################################################

        location /ws/chat/ {

            auth_request /auth;


            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_email $upstream_http_x_user_email;
            auth_request_set $user_role $upstream_http_x_user_role;


            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Email $user_email;
            proxy_set_header X-User-Role $user_role;


            

            proxy_http_version 1.1;


            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";


            proxy_set_header Host ecommerce-platform-252e.onrender.com;


            proxy_pass https://ecommerce-platform-252e.onrender.com;
        }



        #################################################
        # DASHBOARD WEBSOCKET
        #################################################

        location /ws/dashboard/ {

            auth_request /auth;


            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_email $upstream_http_x_user_email;
            auth_request_set $user_role $upstream_http_x_user_role;


            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Email $user_email;
            proxy_set_header X-User-Role $user_role;


            proxy_set_header Authorization $http_authorization;


            proxy_http_version 1.1;


            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";


            proxy_set_header Host ecommerce-platform-252e.onrender.com;


            proxy_pass https://ecommerce-platform-252e.onrender.com;
        }

    }
}