server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # CORS
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Vary Origin always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # Health
    location /health {
        return 200 "nginx ok";
    }

    # AUTH - User Service
    location = /auth {
        internal;

        proxy_pass http://127.0.0.1:8001/users/verify/;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
    }

    # USER SERVICE
    location /api/users/ {
        proxy_pass http://127.0.0.1:8001/users/;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    # PRODUCT CATEGORIES
    location /api/products/categories/ {
        proxy_pass http://127.0.0.1:8002/products/categories/;
    }

    # PRODUCT BANNER
    location /api/products/banner/ {
        proxy_pass http://127.0.0.1:8002/products/banner/;
    }

    # PRODUCT SERVICE
    location /api/products/ {
        auth_request /auth;

        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_email $upstream_http_x_user_email;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Email $user_email;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header Authorization $http_authorization;

        proxy_pass http://127.0.0.1:8002/products/;
    }

    # MEDIA
    location /media/ {
        proxy_pass http://127.0.0.1:8002/media/;
    }

    # ORDER SERVICE
    location /api/orders/ {
        auth_request /auth;

        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_email $upstream_http_x_user_email;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Email $user_email;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header Authorization $http_authorization;

        proxy_pass http://127.0.0.1:8003/orders/;
    }

    # PAYMENT - inside ORDER SERVICE
    location /api/payments/ {
        auth_request /auth;

        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_email $upstream_http_x_user_email;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Email $user_email;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header Authorization $http_authorization;

        proxy_pass http://127.0.0.1:8003/payments/;
    }

    # CHAT API
    location /api/chat/ {
        auth_request /auth;

        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_email $upstream_http_x_user_email;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Email $user_email;
        proxy_set_header X-User-Role $user_role;
        proxy_set_header Authorization $http_authorization;

        proxy_pass http://127.0.0.1:8004/chat/;
    }

    # CHAT WEBSOCKET
    location /ws/chat/ {
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_pass http://127.0.0.1:8004;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # DASHBOARD WEBSOCKET
    location /ws/dashboard/ {
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_pass http://127.0.0.1:8004;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
